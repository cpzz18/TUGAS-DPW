<!DOCTYPE html>
<html>
<head>
    <title>Form Pendaftaran</title>
</head>
<body>
    <h1>Form Pendaftaran</h1>
    <form action="proses_pendaftaran.php" method="post">
        <label for="nim">NIM:</label>
        <input type="text" id="nim" name="nim" required><br>
        <label for="nama">Nama:</label>
        <input type="text" id="nama" name="nama" required><br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br>
        <label>Tempat Tanggal Lahir:</label>
        <input type="text" id="tempat_lahir" name="tempat_lahir" required>
        <input type="date" id="tanggal_lahir" name="tanggal_lahir" required><br>
        <label for="alamat">Alamat:</label>
        <textarea id="alamat" name="alamat" required></textarea><br>
        <label for="gender">Jenis Kelamin:</label>
        <input type="radio" id="gender_l" name="gender" value="Laki-laki" required> Laki-laki
        <input type="radio" id="gender_p" name="gender" value="Perempuan" required> Perempuan<br>
        <input type="submit" value="kirim">
    </form>
</body>
</html>
