<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pseudo</title>
    <style>
      p {
        display: none;
        background-color: darkgray;
        padding: 20px;
      }
      div:hover p {
        display: block;
      }
      a {
        color: blue;
        text-decoration: none;
      }
      a:hover {
        color: red;
      }
    </style>
  </head>
  <body>
    <h1>pseudo class</h1>
    <div>
      Letakkan kursor disini untuk melihat div element
      <p>saya adalah element</p>

    </div>
    <br />
    <a href="#">Hover saya</a>
  </body>
</html>
