<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    Klik pada musik yang paling Anda sukai<br />

    <form name="formTes" method="GET">
      <input
        type="radio"
        name="radioMusik"
        value="POP"
        onclick="info()"
      />Jazz<br />
      <input
        type="radio"
        name="radioMusik"
        value="ROCK"
        onclick="info()"
      />Keroncong<br />
      <input
        type="radio"
        name="radioMusik"
        value="Dangdut"
        onclick="info()"
      />Dangdut<br />
      <input
        type="radio"
        name="radioMusik"
        value="Lainnya"
        onclick="info()"
      />Lainnya<br />

      <hr />
      Info:
      <input type="text" name="fieldMusik" size="40" />
    </form>

    <script language="JavaScript">
      function info() {
        for (var i = 0; i < 4; i++) {
          if (document.formTes.radioMusik[i].checked) {
            document.formTes.fieldMusik.value =
              document.formTes.radioMusik[i].value;
          }
        }
      }
    </script>
  </body>
</html>
