<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
      background: #f0f0f0;
    }

    button {
      background: #28a745;
      color: white;
      border: none;
      padding: 12px 25px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
    }

    button:hover {
      background: #218838;
    }

    /* Dialog */
    #downloadDialog {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 999;
    }

    .dialog-box {
      background: white;
      width: 400px;
      margin: 150px auto;
      border-radius: 10px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .dialog-header {
      background: #28a745;
      color: white;
      padding: 15px;
      border-radius: 10px 10px 0 0;
      font-weight: bold;
      font-size: 18px;
    }

    .dialog-body {
      padding: 20px;
    }

    .progress-container {
      background: #e0e0e0;
      border-radius: 10px;
      height: 25px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-bar {
      background: #28a745;
      width: 0%;
      height: 100%;
      text-align: center;
      line-height: 25px;
      color: white;
      font-size: 12px;
      transition: width 0.3s ease;
    }

    .info {
      text-align: center;
      margin: 15px 0;
      color: #666;
    }

    .dialog-footer {
      padding: 15px;
      text-align: right;
      border-top: 1px solid #ddd;
    }

    .close-btn {
      background: #dc3545;
      padding: 8px 20px;
    }

    .close-btn:hover {
      background: #c82333;
    }

    .status {
      text-align: center;
      margin-top: 10px;
      font-weight: bold;
    }
  </style>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <body>
    <button id="btnDownload">Mulai Download</button>

    <div id="downloadDialog">
      <div class="dialog-box">
        <div class="dialog-header">Download File</div>
        <div class="dialog-body">
          <div class="info">Sedang mengunduh...</div>
          <div class="progress-container">
            <div class="progress-bar" id="progressBar">0%</div>
          </div>
          <div class="status" id="statusText">Memulai download...</div>
        </div>
        <div class="dialog-footer">
          <button id="btnBatal" class="close-btn">Batal</button>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        let progressInterval;
        let progress = 0;

        $("#btnDownload").click(function () {
          $("#downloadDialog").fadeIn(300);
          startDownload();
        });

        function startDownload() {
          progress = 0;
          $(".progress-bar").css("width", "0%");
          $(".progress-bar").text("0%");
          $("#statusText").text("Memulai download...");

          clearInterval(progressInterval);

          progressInterval = setInterval(function () {
            if (progress < 100) {
              progress += Math.floor(Math.random() * 10) + 1;
              if (progress > 100) progress = 100;

              $(".progress-bar").css("width", progress + "%");
              $(".progress-bar").text(progress + "%");

              if (progress < 30) {
                $("#statusText").text("Menghubungkan ke server...");
              } else if (progress < 70) {
                $("#statusText").text("Mengunduh data...");
              } else if (progress < 100) {
                $("#statusText").text("Hampir selesai...");
              } else {
                $("#statusText").text("Download selesai!");
                clearInterval(progressInterval);

                setTimeout(function () {
                  $("#downloadDialog").fadeOut(300);
                  resetProgress();
                }, 2000);
              }
            }
          }, 200);
        }

        function resetProgress() {
          progress = 0;
          $(".progress-bar").css("width", "0%");
          $(".progress-bar").text("0%");
          clearInterval(progressInterval);
        }

        $("#btnBatal").click(function () {
          clearInterval(progressInterval);
          $("#statusText").text("Download dibatalkan!");

          setTimeout(function () {
            $("#downloadDialog").fadeOut(300);
            resetProgress();
          }, 1000);
        });

        $("#downloadDialog").click(function (e) {
          if (e.target === this) {
            clearInterval(progressInterval);
            $("#downloadDialog").fadeOut(300);
            resetProgress();
          }
        });
      });
    </script>
  </body>
</html>
