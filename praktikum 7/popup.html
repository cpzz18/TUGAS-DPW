<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Dialog Basic jQuery</title>
    <style>
      body {
        font-family: Arial;
        padding: 20px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
      }

      /* Dialog */
      #dialog {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
      }

      .dialog-box {
        background: white;
        width: 300px;
        margin: 100px auto;
        border-radius: 5px;
      }

      .dialog-header {
        background: blue;
        color: white;
        padding: 10px;
      }

      .dialog-body {
        padding: 20px;
      }

      .dialog-footer {
        padding: 10px;
        text-align: right;
      }

      .close {
        background: red;
      }
    </style>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  </head>
  <body>
    <button id="buka">Buka Dialog</button>

    <div id="dialog">
      <div class="dialog-box">
        <div class="dialog-header">Informasi</div>
        <div class="dialog-body">Halo! Namaku Chandra</div>
        <div class="dialog-footer">
          <button id="tutup" class="close">Tutup</button>
        </div>
      </div>
    </div>

    <script>
      $(document).ready(function () {
        $("#buka").click(function () {
          $("#dialog").fadeIn(300);
        });

        $("#tutup").click(function () {
          $("#dialog").fadeOut(300);
        });

        $("#dialog").click(function (e) {
          if (e.target === this) {
            $("#dialog").fadeOut(300);
          }
        });
      });
    </script>
  </body>
</html>
