<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Robbin Chandra" />
    <meta name="nim" content="253307059" />
    <title>Halaman SVG</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
      }

      header {
        background-color: #666;
        padding: 30px;
        text-align: center;
        font-size: 35px;
        color: white;
      }

      nav {
        float: left;
        width: 30%;
        background: #ccc;
        padding: 20px;
      }

      nav ul {
        list-style-type: none;
        padding: 0;
      }

      nav li {
        margin: 10px 0;
      }

      article {
        float: left;
        padding: 20px;
        width: 70%;
        background-color: #f1f1f1;
      }

      section::after {
        content: "";
        display: table;
        clear: both;
      }

      .svg {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
      }

      footer {
        background-color: #777;
        padding: 10px;
        text-align: center;
        color: white;
      }

      @media (max-width: 600px) {
        nav,
        article {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>Judul Website</header>

    <section>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="gambar.html">Gambar</a></li>
          <li><a href="event.html">Event</a></li>
          <li><a href="audio.html">Audio</a></li>
          <li><a href="video.html">Video</a></li>
          <li><a href="svg.html">SVG</a></li>
          <li><a href="canvas.html">Canvas</a></li>
          <li><a href="pendaftaran.html">Pendaftaran</a></li>
        </ul>
      </nav>

      <article>
        <h1>SVG HTML</h1>

        <div class="svg">
          <svg width="120" height="120">
            <circle
              cx="60"
              cy="60"
              r="40"
              stroke="green"
              stroke-width="4"
              fill="yellow"
            />
          </svg>

          <svg width="120" height="120">
            <rect
              width="100"
              height="100"
              style="fill: blue; stroke: black; stroke-width: 3"
            />
          </svg>

          <svg width="200" height="150">
            <rect
              x="20"
              y="10"
              rx="15"
              ry="15"
              width="150"
              height="100"
              style="fill: red; stroke: black; stroke-width: 3; opacity: 0.6"
            />
          </svg>

          <!-- Polygon -->
          <svg height="260" width="500" xmlns="http://www.w3.org/2000/svg">
            <polygon points="220,10 300,210 170,250 123,234" style="fill:lime;stroke:purple;stroke-width:3" />
          </svg>
        </div>
      </article>
    </section>

    <footer>
      <i>copyright Robbin Chandra F &copy; 2026</i>
    </footer>
  </body>
</html>
