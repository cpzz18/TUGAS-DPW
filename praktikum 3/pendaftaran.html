    <meta charset="UTF-8" />

    <title>Form Penjadwalan Pertemuan</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, Helvetica, sans-serif;
      }

      header {
        background-color: #666;
        padding: 30px;
        text-align: center;
        font-size: 35px;
        color: white;
      }

      nav {
        float: left;
        width: 30%;
        background: #ccc;
        padding: 20px;
      }

      nav ul {
        list-style-type: none;
        padding: 0;
      }

      article {
        float: left;
        padding: 20px;
        width: 70%;
        background-color: #f1f1f1;
      }

      section::after {
        content: "";
        display: table;
        clear: both;
      }

      fieldset {
        margin-bottom: 15px;
      }

      table td {
        padding: 5px;
      }

      footer {
        background-color: #777;
        padding: 10px;
        text-align: center;
        color: white;
      }

      @media (max-width: 600px) {
        nav,
        article {
          width: 100%;
        }
      }
    </style>
  </head>

  <body>
    <header>Form Penjadwalan Pertemuan</header>

    <section>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="gambar.html">Gambar</a></li>
          <li><a href="event.html">Event</a></li>
          <li><a href="audio.html">Audio</a></li>
          <li><a href="video.html">Video</a></li>
          <li><a href="svg.html">SVG</a></li>
          <li><a href="canvas.html">Canvas</a></li>
          <li><a href="pendaftaran.html">Pendaftaran</a></li>
        </ul>
      </nav>

      <article>
        <h1>Form Penjadwalan Pertemuan</h1>

        <form>
          <!-- Informasi Pribadi -->
          <fieldset>
            <legend>Informasi Pribadi</legend>
            <table>
              <tr>
                <td><label for="nama">Nama</label></td>
                <td><input type="text" id="nama" /></td>
              </tr>

              <tr>
                <td><label for="telepon">No. Telepon</label></td>
                <td>
                  <input type="tel" id="telepon" pattern="[0-9]{4}-[0-9]{6}" />
                </td>
              </tr>

              <tr>
                <td><label for="email">Alamat Email</label></td>
                <td>
                  <input
                    type="email"
                    id="email"
                    placeholder="nama@domain.com"
                  />
                </td>
              </tr>

              <tr>
                <td><label for="tgl_lahir">Tanggal Lahir</label></td>
                <td>
                  <input
                    type="date"
                    id="tgl_lahir"
                    min="1987-01-01"
                    max="1993-01-01"
                  />
                </td>
              </tr>
            </table>
          </fieldset>

          <!-- Permintaan Pertemuan -->
          <fieldset>
            <legend>Permintaan Pertemuan</legend>
            <table>
              <tr>
                <td><label for="tujuan">Tujuan Pertemuan</label></td>
                <td><input type="text" id="tujuan" /></td>
              </tr>

              <tr>
                <td><label for="kepentingan">Tingkat Kepentingan</label></td>
                <td>
                  0
                  <input
                    type="range"
                    id="kepentingan"
                    min="0"
                    max="10"
                    value="5"
                  />
                  10
                </td>
              </tr>

              <tr>
                <td><label for="tanggal">Tanggal</label></td>
                <td>
                  <input type="date" id="tanggal" min="2026-01-01" />
                </td>
              </tr>

              <tr>
                <td><label for="waktu">Waktu</label></td>
                <td>
                  <input type="time" id="waktu" min="17:00" max="21:00" />
                </td>
              </tr>
            </table>
          </fieldset>

          <input type="submit" value="Submit" />
        </form>
      </article>
    </section>

    <footer>
      <i>copyright Robbin Chandra F &copy; 2026</i>
    </footer>
  </body>
</html>
