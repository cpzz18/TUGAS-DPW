<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belajar Flek box</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
      }

      h1 {
        margin: 20px;
      }

      .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        padding: 10px;
      }

      .gallery img {
        width: 9rem; /* ganti sesuai NPM (Akhir) */
        height: 9rem; /* ganti sesuai NPM  (Akhir)*/
        object-fit: cover;
        border-radius: 10px;
        transition: 0.3s;
      }

      .gallery img:hover {
        transform: scale(1.1);
      }
    </style>
  </head>
  <body>
    <h1>Gallery Foto</h1>

    <div class="gallery">
      <img src="img/img1.jpg" alt="" />
      <img src="img/img2.jpg" alt="" />
      <img src="img/img3.jpg" alt="" />
      <img src="img/img4.jpg" alt="" />
      <img src="img/img5.jpg" alt="" />
      <img src="img/img6.jpg" alt="" />
      <img src="img/img7.jpg" alt="" />
      <img src="img/img8.jpg" alt="" />
      <img src="img/img9.jpg" alt="" />
      <img src="img/img10.jpg" alt="" />
      <img src="img/img11.jpg" alt="" />
      <img src="img/img12.jpg" alt="" />
      <img src="img/img13.jpg" alt="" />
      <img src="img/img14.jpg" alt="" />
      <img src="img/img15.jpg" alt="" />
      <img src="img/img16.jpg" alt="" />
      <img src="img/img17.jpg" alt="" />
      <img src="img/img18.jpg" alt="" />
    </div>
  </body>
</html>
