<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
          font-family: Arial, Helvetica, sans-serif;
          margin: 0;
          background-color: #f5f7fa;
        }
    
        .container {
          display: grid;
          grid-template-areas:
            "header header header"
            "menu main right"
            "footer footer footer";
    
          grid-template-columns: 1fr 2fr 1fr;
          gap: 10px;
          padding: 10px;
        }
    
        .container div {
          padding: 20px;
          text-align: center;
          border-radius: 10px;
          color: #333;
          font-weight: bold;
        }
    
        .header {
          grid-area: header;
          background: #4f46e5; /* indigo */
          color: white;
        }
    
        .menu {
          grid-area: menu;
          background: #e0e7ff;
        }
    
        .main {
          grid-area: main;
          background: #ffffff;
          box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
    
        .right {
          grid-area: right;
          background: #e0f2fe;
        }
    
        .footer {
          grid-area: footer;
          background: #1e293b;
          color: white;
        }
      </style>
</head>
<body>
    <div class="container">
        <div class="header">Header</div>
        <div class="menu">Menu</div>
        <div class="main">Main</div>
        <div class="right">Right</div>
        <div class="footer">Footer</div>
      </div>
</body>
</html>
