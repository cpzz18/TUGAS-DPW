    <section class="contact py-5" id="contact">
      <div class="container-lg py-4">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="section-title text-center">
              <h2 class="fw-bold mb-5">Hubungi Saya</h2>
              <p class="mb-5">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Aut,
                placeat.
              </p>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6">
            <form action="+62881965345" method="post">
              <div class="mb-3">
                <label for="name" class="form-label">Nama Lengkap</label>
                <input type="text" class="form-control" id="name" required />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Alamat Email</label>
                <input type="email" class="form-control" id="email" required />
              </div>
              <div class="mb-3">
                <label for="message" class="form-label">Pesan</label>
                <textarea
                  class="form-control"
                  id="message"
                  rows="4"
                  placeholder="Tulis pesan Anda..."
                ></textarea>
              </div>
              <button type="submit" class="btn btn-success px-4">
                Kirim Pesan
              </button>
            </form>
          </div>
          <div class="col-md-6 mt-5 mt-md-0">
            <div class="contact-info">
              <h4 class="mb-3">Informasi Kontak</h4>
              <p>
                <i
                  class="fas fa-envelope"
                  style="color: #64ffda; margin-right: 10px"
                ></i>
                robbincfa@gmail.com
              </p>
              <p>
                <i
                  class="fas fa-phone-alt"
                  style="color: #64ffda; margin-right: 10px"
                ></i>
                +62 812 3456 7890
              </p>
              <p>
                <i
                  class="fas fa-map-marker-alt"
                  style="color: #64ffda; margin-right: 10px"
                ></i>
                Kota Madiun, Indonesia
              </p>
              <hr />
              <div class="social-links mt-4">
                <a href="https://www.instagram.com/rbbincfa_/" class="btn btn-outline-success me-2"
                  ><i class="fab fa-instagram"></i
                ></a>
                <a href="https://github.com/cpzz18" class="btn btn-outline-success me-2"
                  ><i class="fab fa-github"></i
                ></a>
                <a href="https://www.linkedin.com/in/robbinchan/" class="btn btn-outline-success me-2"
                  ><i class="fab fa-linkedin"></i
                ></a>

            </div>
