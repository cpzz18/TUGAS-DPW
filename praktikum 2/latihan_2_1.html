<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>div and span</title>
    <link rel="icon" type="image/png" href="gambar/icon.png" sizes="16x16" />
  </head>
  <body>
    <div id="berita">
      <img src="gambar/gambar1.png" alt="gambar pemandangan" />
      <p>Gambar ini bagus sekali</p>
      <p>Kombinasinya bagus sekali</p>
    </div>
    <ul>
      <li>Lisa <span class="phone">082349841</span></li>
      <li>Joan <span class="phone">0832424235</span></li>
      <li>Steve <span class="phone">082342347842</span></li>
    </ul>
  </body>
</html>
